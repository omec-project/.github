name: E2E tests

on:
  workflow_call:
    inputs:
      branch_name:
        description: "Name of the branch to checkout"
        required: false
        type: string
        default: ${{ github.ref }}
      image_list:
        description: "Space-separated image names to build and override for testing"
        required: false
        type: string
        default: ""

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: aether-5gc
      INPUT_IMAGE_LIST: ${{ inputs.image_list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout omec-project/.github repository for scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .github-repo

      - name: Set image list
        run: |
          set -euo pipefail
          REPO_NAME=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)
          # webconsole uses 'webui' as the image name
          IMAGE_NAME="${REPO_NAME/webconsole/webui}"
          IMAGE_LIST="${INPUT_IMAGE_LIST}"
          if [[ "${IMAGE_LIST}" == *$'\n'* || "${IMAGE_LIST}" == *$'\r'* ]]; then
            echo "ERROR: image_list must be a single line" >&2
            exit 1
          fi
          if [ "${REPO_NAME}" = "gnbsim" ] && [ -n "${IMAGE_LIST}" ]; then
            echo "ERROR: image_list is not supported for GNBSIM" >&2
            exit 1
          fi
          if [ -z "${IMAGE_LIST}" ]; then
            IMAGE_LIST="${IMAGE_NAME}"
            if [ "${REPO_NAME}" = "upf" ]; then
              IMAGE_LIST="bess pfcp"
            fi
          fi
          echo "REPO_NAME=${REPO_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "IMAGE_LIST=${IMAGE_LIST}" >> "$GITHUB_ENV"
          echo "Repository: ${REPO_NAME}"
          echo "Image list: ${IMAGE_LIST}"

      - name: Update and install dependencies
        run: |
          set -e
          sudo apt update
          # Kubernetes dependencies
          sudo apt-get install -y conntrack socat ipset ebtables jq
          # Build and automation tools
          sudo apt install -y make ansible python3-yaml
          # Print Ansible version for reproducibility tracking
          ansible --version

      - name: Clone aether-onramp repository
        run: |
          set -e
          REPO_URL="https://github.com/opennetworkinglab/aether-onramp.git"
          # Track the latest aether-onramp main branch for integration testing
          AETHER_ONRAMP_REF="main"
          # Clone onramp repository to parent directory to avoid polluting current workspace
          AETHER_ONRAMP_DIR="${GITHUB_WORKSPACE}/../aether-onramp"
          if ! git clone --branch "${AETHER_ONRAMP_REF}" --depth 1 "${REPO_URL}" "${AETHER_ONRAMP_DIR}"; then
            echo "ERROR: Failed to clone aether-onramp repository from ${REPO_URL}" >&2
            exit 1
          fi
          cd "${AETHER_ONRAMP_DIR}"
          echo "=== aether-onramp commit used ==="
          git log -1 --format="Commit: %H%nAuthor: %an%nDate: %ad%nMessage: %s"
          # Export for use in subsequent steps
          echo "AETHER_ONRAMP_DIR=${AETHER_ONRAMP_DIR}" >> "$GITHUB_ENV"

      - name: Update aether-onramp configuration files
        run: |
          # Generate a local-only inventory and update onramp configuration for CI
          if [ "${REPO_NAME}" = "gnbsim" ]; then
            python3 .github-repo/.github/scripts/update-aether-files.py "${AETHER_ONRAMP_DIR}" --gnbsim-image "localhost:5000/${IMAGE_NAME}:testing"
          else
            read -r -a image_names <<< "${IMAGE_LIST}"
            python3 .github-repo/.github/scripts/update-aether-files.py "${AETHER_ONRAMP_DIR}" --image-list "${image_names[@]}"
          fi

      - name: Check values file
        run: |
          cat "${AETHER_ONRAMP_DIR}/deps/5gc/roles/core/templates/sdcore-5g-values.yaml"

      - name: Test aether-pingall
        run: |
          set -e
          cd "${AETHER_ONRAMP_DIR}"
          make aether-pingall

      - name: Install aether-k8s
        run: |
          set -e
          cd "${AETHER_ONRAMP_DIR}"
          make aether-k8s-install

      - name: Build and push local image to registry
        run: |
          set -ex

          # Use the repository already checked out in the workspace
          cd "${GITHUB_WORKSPACE}"

          # Set up a local registry to serve the image; use host networking to avoid exposing an extra mapped port
          echo "=== Starting local registry ==="
          docker run -d --network host --name registry registry:2

          read -r -a image_names <<< "${IMAGE_LIST}"
          for image_name in "${image_names[@]}"; do
            local_image_name="localhost:5000/${image_name}:testing"
            if [ "${REPO_NAME}" = "upf" ]; then
              echo "=== Building Docker image ${local_image_name} (target: ${image_name}) ==="
              docker build --target "${image_name}" -t "${local_image_name}" .
            else
              echo "=== Building Docker image ${local_image_name} ==="
              docker build -t "${local_image_name}" .
            fi

            echo "=== Pushing Docker image ${local_image_name} to local registry ==="
            docker push "${local_image_name}"

            echo "=== Verifying ${image_name} in local registry ==="
            curl -f -X GET "http://localhost:5000/v2/${image_name}/tags/list"
          done

      - name: Install 5G Core
        id: install-5gc
        run: |
          set -e
          cd "${AETHER_ONRAMP_DIR}"
          make aether-5gc-install

      - name: Pods status
        run: |
          set -e
          echo "Pods status"
          kubectl get pods -n "$NAMESPACE"

      - name: Verify deployed test images
        run: |
          set -euo pipefail

          if [ "${REPO_NAME}" = "gnbsim" ]; then
            echo "Skipping Kubernetes image verification for GNBSIM; it runs as a Docker container."
            exit 0
          fi

          deployed_images="$(
            kubectl get pods -n "$NAMESPACE" -o json |
              jq -r '.items[].status.containerStatuses[]? | select(.state.running != null) | .image' |
              sort -u
          )"

          echo "Deployed container images:"
          printf '%s\n' "$deployed_images"

          read -r -a image_names <<< "${IMAGE_LIST}"
          for image_name in "${image_names[@]}"; do
            expected="localhost:5000/${image_name}:testing"
            if ! printf '%s\n' "$deployed_images" | grep -Fqx -- "$expected"; then
              echo "Expected deployed testing image was not found: $expected" >&2
              exit 1
            fi
            echo "Verified deployed testing image: $expected"
          done

      - name: Install GNBSIM
        run: |
          set -e
          cd "${AETHER_ONRAMP_DIR}"
          make aether-gnbsim-install

      - name: Perform tests
        run: |
          set -e
          cd "${AETHER_ONRAMP_DIR}"
          make aether-gnbsim-run

      - name: Validate results
        run: |
          set -e
          # Capture summary.log contents and verify it exists
          status=$(docker exec gnbsim-1 cat summary.log 2>/dev/null) || {
            echo "Failed to read summary.log from gnbsim-1 container."
            exit 1
          }

          if [ -z "$status" ]; then
            echo "summary.log is missing or empty."
            exit 1
          fi

          if echo "$status" | grep -q "Profile Status: PASS"; then
            echo "Profile Status is successful."
            echo "summary.log contents:"
            echo "$status"
          else
            echo "Profile Status does not indicate success (expected 'Profile Status: PASS')."
            echo "summary.log contents:"
            echo "$status"
            exit 1
          fi

      - name: Cleanup local registry
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep -q '^registry$'; then
            echo "Stopping and removing local registry container..."
            docker stop registry || true
            docker rm registry || true
          fi

      - name: Dump all pod logs in aether-5gc namespace
        if: always() && (steps.install-5gc.outcome == 'success' || steps.install-5gc.outcome == 'failure')
        run: |
          set -ex

          mkdir -p logs
          kubectl get events -A --sort-by='.lastTimestamp' > logs/events.log
          kubectl get pods -n "$NAMESPACE" -o wide > logs/pods-summary.log
          for pod in $(kubectl get pods -n "$NAMESPACE" -o jsonpath='{.items[*].metadata.name}'); do
            if ! kubectl logs --all-containers -n "$NAMESPACE" "$pod" > "logs/${pod}.log" 2>&1; then
              echo "Failed to collect logs for pod ${pod} using '--all-containers'; attempting fallback without the flag." | tee -a logs/log-collection-errors.log
              if ! kubectl logs -n "$NAMESPACE" "$pod" >> "logs/${pod}.log" 2>&1; then
                echo "Fallback log collection for pod ${pod} without '--all-containers' also failed." | tee -a logs/log-collection-errors.log
              fi
            fi
          done
          for image_name in ${IMAGE_LIST}; do
            for pod in $(kubectl get pods -n "$NAMESPACE" -l app="${image_name}" -o jsonpath='{.items[*].metadata.name}'); do
              kubectl describe pod -n "$NAMESPACE" "$pod" > "logs/${pod}-describe.log" 2>&1 || true
            done
          done
          docker exec gnbsim-1 cat gnbsim.log > logs/gnbsim.log 2>&1 || true

      - name: Upload pod logs
        if: always() && (steps.install-5gc.outcome == 'success' || steps.install-5gc.outcome == 'failure')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aether-5gc-logs
          path: logs/
